[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testgen-agent"
version = "0.1.0"
description = "A small Python unit-test generation agent using DeepSeek"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "pytest==9.1.1",
    "coverage==7.16.1",
]

[project.scripts]
testgen-agent = "testgen_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["testgen_agent"]

[tool.coverage.report]
show_missing = true
